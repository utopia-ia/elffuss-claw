<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Elffuss · broker de modelos</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#090a11;color:#8b929c;font:13px system-ui;display:grid;place-items:center;height:100vh}</style>
</head><body>
<div>Elffuss · caché compartida de modelos. Esta página no se usa directamente.</div>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// BROKER DE MODELOS · caché OPFS compartida entre todas las webs de Elffuss.
// Se embebe como iframe oculto desde cada propiedad (claw/translator/copilot/…).
// Como todas son subdominios de elffuss.com (mismo «site»), este iframe es
// first-party en todas y comparte UNA sola OPFS → el modelo se descarga UNA vez
// y se reutiliza en todas. (Un tercero que lo integre tiene su propia partición
// por privacidad del navegador: se baja una vez POR SU site. Los hosts viejos de
// elffuss.utopiaia.com son, para el navegador, otro site distinto.)
// API postMessage: {type:'elffuss-model-get', id, url} → progress* → begin →
// chunk* (ArrayBuffer transferible) → end | error.  {type:'elffuss-model-has',id,url}
// ─────────────────────────────────────────────────────────────────────────────
const DIR = 'elffuss-models';
const CHUNK = 8 * 1024 * 1024;
// Orígenes permitidos: las webs de Elffuss que embeben este broker, y nada más.
// NO todo *.utopiaia.com, que es lo que ponía antes: ese dominio aloja más cosas
// que Elffuss. Y tampoco todo *.elffuss.com: git.* es un Gitea que pinta markdown
// escrito por cualquiera, y key.* no tiene nada que pedirle al broker. Como son
// del mismo «site», un script colado ahí hablaría con este iframe en su caché
// compartida: vería lo que hay guardado y podría llenarla de descargas.
//   · elffuss.com y claw, code, t2t, translator, copilot, models, m1, m2… .elffuss.com
//   · lo mismo bajo elffuss.utopiaia.com (el dominio anterior: se sigue aceptando
//     mientras dure el cambio de dominio)
//   · los alias más viejos elffuss-claw y elffuss-code .utopiaia.com
//   · las herramientas tools, cutout, ocr, detect y depth .elffuss.com, solo con
//     permiso de lectura (ver permisoHerramienta)
// Las integraciones de terceros se añaden por query (?allow=https://otra.com)
// — cada una en su propia partición.
const extra = new URLSearchParams(location.search).getAll('allow');
const WEBS = /^https:\/\/((claw|code|t2t|translator|copilot|models|m\d+)\.)?elffuss\.(com|utopiaia\.com)$/;
// Las herramientas (repo elffuss-ai): el catálogo y una web por herramienta. Solo
// su nombre exacto y solo bajo elffuss.com, que es donde viven.
const HERRAMIENTAS = /^https:\/\/(tools|cutout|ocr|detect|depth)\.elffuss\.com$/;
function allowed(origin) {
  if (WEBS.test(origin)) return true;
  if (HERRAMIENTAS.test(origin)) return true;
  if (/^https:\/\/(elffuss-(claw|code)|burn-my-computer)\.utopiaia\.com$/.test(origin)) return true;   // alias antiguos y Burn My Computer
  if (/^http:\/\/localhost(:\d+)?$/.test(origin)) return true;     // desarrollo
  return extra.includes(origin);
}
// Igual que en server/broker/index.html.
// Lo que puede pedir una herramienta: bajar o consultar uno de los ficheros de su
// registro, fijado a su commit, diciendo su tamaño exacto. Nada más: ni otros
// ficheros u otros commits de esos repos, ni vaciar el almacén, ni guardar
// copias, ni el diagnóstico, que lista lo que guardan las demás webs. Así un fallo
// en una de esas páginas, que abren ficheros del usuario, no puede llenar el
// almacén con lo que quiera ni borrar los modelos de Claw o de Code, y tampoco
// puede curar (borrar) una copia mandando un tamaño falso: el tamaño es el de la
// lista o no hay respuesta.
// Los ficheros de las variantes de registry/tasks.json de elffuss-ai, con su tamaño.
// El bloque lo imprime scripts/broker-repos.mjs de ese repo, y un test de allí
// comprueba que esta copia es exactamente la de su registro.
const FICHEROS_HERRAMIENTAS = new Map([
  ["https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/28fe5895c24fd108c19eb3e8479f4ab385fbfc62/inference.onnx", 9880512],
  ["https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/28fe5895c24fd108c19eb3e8479f4ab385fbfc62/inference.yml", 885],
  ["https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx", 21159378],
  ["https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml", 150579],
  ["https://huggingface.co/onnx-community/BEN2-ONNX/resolve/c552aa82688edce09f0ac9d2e31ad53d9d629010/config.json", 80],
  ["https://huggingface.co/onnx-community/BEN2-ONNX/resolve/c552aa82688edce09f0ac9d2e31ad53d9d629010/onnx/model_fp16.onnx", 219121675],
  ["https://huggingface.co/onnx-community/BEN2-ONNX/resolve/c552aa82688edce09f0ac9d2e31ad53d9d629010/preprocessor_config.json", 391],
  ["https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/config.json", 38],
  ["https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model.onnx", 99060839],
  ["https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model_fp16.onnx", 49642442],
  ["https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model_quantized.onnx", 27258801],
  ["https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/preprocessor_config.json", 461],
  ["https://huggingface.co/onnx-community/rfdetr_nano-ONNX/resolve/eae21cee0687a91bcf9fa071605c48d7705d2d91/config.json", 3213],
  ["https://huggingface.co/onnx-community/rfdetr_nano-ONNX/resolve/eae21cee0687a91bcf9fa071605c48d7705d2d91/onnx/model_quantized.onnx", 28826010],
  ["https://huggingface.co/onnx-community/rfdetr_nano-ONNX/resolve/eae21cee0687a91bcf9fa071605c48d7705d2d91/preprocessor_config.json", 444],
]);
function permisoHerramienta(type, url, bytes) {
  const tam = FICHEROS_HERRAMIENTAS.get(String(url ?? ''));
  if (!tam) return false;
  const dice = bytes == null || bytes === '' ? null : Number(bytes);
  if (type === 'elffuss-model-get') return dice === tam;
  if (type === 'elffuss-model-has') return dice === null || dice === tam;
  return type === 'elffuss-model-cancel';
}
const keyFor = u => String(u).replace(/[?#].*$/, '').replace(/[^\w.\-]+/g, '_').slice(-180);
async function requestPersist(){ try{ if(navigator.storage?.persist){ return (await navigator.storage.persisted?.()) || await navigator.storage.persist(); } }catch{} return false; }
async function dir(){ const root = await navigator.storage.getDirectory(); return root.getDirectoryHandle(DIR, { create:true }); }

async function cachedFile(url){
  try{ const d = await dir(); const k = keyFor(url);
    await d.getFileHandle(k + '.done');                       // marcador de completado
    const f = await (await d.getFileHandle(k)).getFile();
    return f.size > 0 ? f : null;
  }catch{ return null; }
}
async function downloadToOPFS(url, onProgress){
  await requestPersist();
  const d = await dir(); const k = keyFor(url);
  const net = await fetch(url);
  if (!net.ok || !net.body) throw new Error('descarga falló: HTTP ' + net.status);
  const total = +net.headers.get('content-length') || 0;
  await d.removeEntry(k + '.done').catch(()=>{});
  const fh = await d.getFileHandle(k, { create:true });
  const w = await fh.createWritable();
  let loaded = 0; const reader = net.body.getReader();
  try{
    for(;;){ const { done, value } = await reader.read(); if (done) break;
      await w.write(value); loaded += value.byteLength; onProgress?.({ loaded, total }); }
    await w.close();
  }catch(e){ try{ await w.abort(); }catch{} await d.removeEntry(k).catch(()=>{}); throw e; }
  const dh = await d.getFileHandle(k + '.done', { create:true }); const dw = await dh.createWritable();
  await dw.write(new TextEncoder().encode(String(loaded))); await dw.close();
  return await (await d.getFileHandle(k)).getFile();
}

let inflight = new Map();   // url → Promise<File> (colapsa descargas simultáneas)
async function getFile(url, onProgress){
  const hit = await cachedFile(url); if (hit) return hit;
  if (inflight.has(url)) return inflight.get(url);
  const p = downloadToOPFS(url, onProgress).finally(()=> inflight.delete(url));
  inflight.set(url, p); return p;
}

addEventListener('message', async e => {
  if (!allowed(e.origin)) return;
  const d = e.data || {}; const { type, id, url } = d;
  const post = (msg, transfer) => { try{ e.source.postMessage({ id, ...msg }, e.origin, transfer || []); }catch{} };
  if (HERRAMIENTAS.test(e.origin) && !permisoHerramienta(type, url, d.bytes)) {
    post({ kind:'error', message:'no permitido desde esta web', tipo:'permiso' });
    return;
  }
  if (type === 'elffuss-model-has') {
    const f = await cachedFile(url); post({ kind:'has', cached: !!f, size: f?f.size:0 }); return;
  }
  if (type === 'elffuss-model-get') {
    try{
      const file = await getFile(url, p => post({ kind:'progress', ...p }));
      // El File de OPFS es un Blob respaldado en DISCO: structured-clone lo pasa
      // POR REFERENCIA (Chromium: vive en el proceso de navegador, ref-contado,
      // paginado a disco) → NO copia los GB a la RAM de ningún renderer. El padre
      // lo lee perezosamente con file.stream(). Mantener este iframe vivo mientras
      // el padre lee (el Blob vivo mantiene referenciados los datos en OPFS).
      post({ kind:'file', file });
    }catch(err){ post({ kind:'error', message: String(err?.message || err) }); }
  }
});
// avisar a quien nos embebe que estamos listos
try{ parent.postMessage({ kind:'elffuss-broker-ready' }, '*'); }catch{}
</script>
</body></html>
