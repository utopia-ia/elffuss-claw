# Cabeceras de la página almacén de la memoria compartida (web/memory/), para el server de claw.elffuss.com.
# Generado desde web/memory/memory.config.js con el script de cabeceras del motor (bench/memory/headers.mjs,
# formato nginx): frame-ancestors son EXACTAMENTE los orígenes de las apps de la config. Si cambia la lista
# de apps, se regenera; tests/memoria-v2-config.mjs falla si este fichero y la config no coinciden.
# Sin registro de accesos en esta ruta: ni las URLs de la memoria quedan en ningún log.
location /memory/ {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://elffuss.com https://claw.elffuss.com https://code.elffuss.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    access_log off;
}
