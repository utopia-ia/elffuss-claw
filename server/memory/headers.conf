# Cabeceras de la página almacén de la memoria compartida (web/memory/), para el server de claw.elffuss.com.
# Generado desde web/memory/memory.config.js con el script de cabeceras del motor (bench/memory/headers.mjs,
# formato nginx): frame-ancestors son EXACTAMENTE los orígenes de las apps de la config. Si cambia la lista
# de apps, se regenera; tests/memoria-v2-config.mjs falla si este fichero y la config no coinciden.
# Sin registro de accesos en esta ruta: ni las URLs de la memoria quedan en ningún log.
# ^~ para que no lo pisen los location de regex del server (~* \.(js|mjs|html|css|json)$): sin él, /memory/ pasa
# por dentro a /memory/index.html (index) y lo servía la regex, sin estas cabeceras y con registro de accesos.
# tests/memoria-v2-nginx.mjs lo comprueba con la forma del server de claw.elffuss.com.
location ^~ /memory/ {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://elffuss.com https://claw.elffuss.com https://code.elffuss.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    # Elffuss Link F0 (deploy/headers.json): this location has add_header of its own, so it does not inherit the
    # server's; the headers every path of claw.elffuss.com carries are repeated here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), payment=(), display-capture=(), browsing-topics=()" always;
    access_log off;
}
